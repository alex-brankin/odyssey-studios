<style>*{box-sizing:border-box}
:root{--bg:#fff;--fg:#1a1a1a;--muted:#5c5c5c;--rule:#e3e3e3;--link:#0b5fff;--code:#f3f4f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#e8e8e8;--muted:#a0a0a0;--rule:#2c2f34;--link:#7aa7ff;--code:#22252a}}
:root[data-theme="dark"]{--bg:#15171a;--fg:#e8e8e8;--muted:#a0a0a0;--rule:#2c2f34;--link:#7aa7ff;--code:#22252a}
body{background:var(--bg);color:var(--fg);margin:0;padding:48px 16px 96px;
font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto}
h1{font-size:2rem;line-height:1.2;margin:0 0 .5rem}
h2{font-size:1.3rem;margin:2.5rem 0 .75rem;padding-top:1.25rem;border-top:1px solid var(--rule)}
h3{font-size:1.05rem;margin:1.75rem 0 .5rem;color:var(--muted)}
p,li{margin:.65rem 0}
ul{padding-left:1.25rem}
a{color:var(--link)}
code{background:var(--code);padding:.1em .35em;border-radius:4px;font-size:.9em}
strong{font-weight:600}
footer{max-width:720px;margin:4rem auto 0;padding-top:1.25rem;border-top:1px solid var(--rule);
color:var(--muted);font-size:.875rem}</style>
</head>
